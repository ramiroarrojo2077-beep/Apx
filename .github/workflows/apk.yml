name: APK

# El SDK de Android no se puede descargar desde el entorno de desarrollo de
# este repo, así que el APK se construye acá, donde sí está disponible.
on:
  push:
    paths:
      - "android/**"
      - "data/conocimiento.json"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    name: Construir e instalar Rama AI
    runs-on: ubuntu-latest
    # Un build colgado no debe quemar horas de runner: que falle y se vea.
    # Compilar llama.cpp para ARM lleva bastante más que el Kotlin.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cachear la compilación nativa
        uses: actions/cache@v4
        with:
          path: |
            android/app/.cxx
            android/app/build/intermediates/cxx
          key: nativo-${{ runner.os }}-${{ hashFiles('android/app/src/main/cpp/**') }}

      - name: Tests del motor
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Construir el APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rama-ai.apk

      # Las instrucciones ARM son lo que más pesa en la velocidad del modelo, y
      # es un ajuste silencioso: si la bandera dejara de aplicarse, el APK
      # seguiría compilando y andando, sólo que varias veces más lento y sin
      # que nadie se entere. Así que lo miramos en el binario mismo.
      - name: Verificar que el .so trae las instrucciones rápidas
        run: |
          set -euo pipefail
          objdump=$(find "$ANDROID_HOME/ndk" -name 'llvm-objdump' -type f | head -1)
          if [ -z "$objdump" ]; then
            echo "No se encontró llvm-objdump en el NDK" >&2
            exit 1
          fi
          unzip -o -q rama-ai.apk 'lib/arm64-v8a/*.so' -d /tmp/so
          libreria=/tmp/so/lib/arm64-v8a/librama_llama.so
          "$objdump" -d "$libreria" > /tmp/rama.asm
          for instruccion in sdot fmla; do
            cuantas=$(grep -cw "$instruccion" /tmp/rama.asm || true)
            echo "$instruccion: $cuantas"
            if [ "$cuantas" -lt 10 ]; then
              echo "El .so casi no usa $instruccion: la bandera de arquitectura no se aplicó" >&2
              exit 1
            fi
          done

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: rama-ai-apk
          path: rama-ai.apk
          if-no-files-found: error

      - name: Publicarlo para descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk \
            --title "Rama AI · APK" \
            --notes "APK de desarrollo, firmado con la clave debug de Android. Se actualiza en cada push." \
            --prerelease
          gh release upload apk rama-ai.apk --clobber
          echo "APK publicado: https://github.com/${{ github.repository }}/releases/download/apk/rama-ai.apk"
