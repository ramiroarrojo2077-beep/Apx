org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# La app no usa AndroidX ni ninguna librería de terceros: sólo el framework,
# y el APK no incluye una sola clase de androidx. La bandera va en true
# únicamente porque Robolectric —que corre la interfaz en los tests— depende
# de androidx.test, y eso vive sólo en el classpath de test.
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
kotlin.code.style=official
